services:
  njtlive:
    build: .
    restart: unless-stopped
    ports:
      # Loopback only; nginx publishes it. Nothing here is secret, but there is
      # no reason to put an unauthenticated endpoint on the open internet.
      - "127.0.0.1:8081:8081"
    volumes:
      - index:/data
      # Read-only: the service reads the NJ Transit login that Tronbyt already
      # stores, rather than keeping a second copy of the password.
      - tronbyt_data:/tronbyt:ro
    # Shares a 2 GB box with Postgres and the 86Proof API. The index lives in
    # SQLite precisely so this stays small.
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request,json,sys; sys.exit(0 if json.load(urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=5))['ok'] else 1)"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 5m

volumes:
  index:
  tronbyt_data:
    external: true
